server:
  port: 3000
  host: 0.0.0.0
pool:
  max_devices: 10
  android:
    enabled: true
    max_instances: 1
    headless: true
    api_level: '35'
    system_image_variant: google_apis_playstore
    device_profile: pixel_7
    ram_mb: 2048
  ios:
    enabled: true
    max_instances: 1
    runtime: iOS-18-5
    device_type: iPhone-16
storage:
  artifacts:
    path: ./storage/artifacts
    retention_days: 15
    compress_after_days: 7
    format: mp4
    max_storage_gb: 50
  logs:
    retention_days: 90
    path: ./storage/logs
jobs:
  timeout_minutes: 30
  max_queue_size: 100
  cleanup_completed_after_days: 7
ui:
  use_report_shell: true
job_metadata_schema:
  required: []
  optional:
    - name: branch
      type: string
    - name: commit_sha
      type: string
    - name: pr_number
      type: string
    - name: pr_url
      type: string
    - name: triggered_by
      type: string
    - name: ci_provider
      type: string
    - name: ci_build_url
      type: string
    - name: repository
      type: string
    - name: tags
      type: string[]
